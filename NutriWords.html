<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriWords</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Nunito',sans-serif;color:#3B3355;background:#FFF9F2;overflow:hidden}
h1,h2,h3{font-family:'Fredoka',sans-serif;font-weight:600;line-height:1.1}
button{font-family:inherit;cursor:pointer}
.deck{position:relative;height:100%;width:100%}
.slide{position:absolute;inset:0;padding:22px 16px 120px;opacity:0;pointer-events:none;transform:translateX(40px) scale(.98);transition:opacity .45s,transform .45s;overflow-y:auto;display:flex;
 background:radial-gradient(circle at 10% 10%,var(--l) 0 90px,transparent 91px),radial-gradient(circle at 92% 30%,var(--l) 0 60px,transparent 61px),radial-gradient(circle at 85% 95%,var(--l) 0 110px,transparent 111px),var(--bg)}
.slide.on{opacity:1;pointer-events:auto;transform:none}
.slide.prev{transform:translateX(-40px) scale(.98)}
.box{width:min(700px,100%);margin:auto;text-align:center;position:relative}
.spark{position:absolute;font-size:22px;animation:tw 2.4s ease-in-out infinite;pointer-events:none}
@keyframes tw{50%{transform:scale(1.4) rotate(20deg);opacity:.5}}

/* COVER */
.cover{background:linear-gradient(160deg,#FFB5D0 0%,#FFD6A5 35%,#B9F3C9 70%,#A8D8FF 100%);padding-bottom:30px}
.cover .fl{position:absolute;font-size:42px;animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px) rotate(8deg)}}
.cover h1{font-size:clamp(54px,13vw,100px);color:#fff;text-shadow:0 5px 0 #E86A9E,0 9px 0 rgba(0,0,0,.08)}
.cover h1 b{color:#FFE066;text-shadow:0 5px 0 #F0A500,0 9px 0 rgba(0,0,0,.08)}
.mascot{font-size:70px;animation:bounce 2s ease-in-out infinite;display:inline-block}
@keyframes bounce{50%{transform:translateY(-10px)}}
.student{margin-top:18px;background:#fff;border-radius:30px;padding:18px 26px;display:inline-block;box-shadow:0 8px 0 #F7C6DA}
.student small{display:block;font-weight:800;letter-spacing:3px;font-size:13px;color:#E86A9E}
.student strong{display:block;font-family:'Fredoka';font-size:clamp(21px,4.6vw,30px);margin:6px 0;color:#3B3355}
.student span{font-weight:700;font-size:16px;color:#25A563}
.teacher{margin-top:14px;padding-top:12px;border-top:3px dashed #F7C6DA}
.teacher strong{font-size:clamp(19px,4vw,24px);color:#4A74E0}
.howto{margin-top:18px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.howto span{background:rgba(255,255,255,.75);border-radius:99px;padding:7px 14px;font-weight:800;font-size:14px}
.start{margin-top:22px;background:#FF7BAC;color:#fff;border:none;border-radius:99px;padding:15px 36px;font-size:20px;font-weight:800;box-shadow:0 6px 0 #D9558A}
.start:active{transform:translateY(4px);box-shadow:none}

/* RULE */
.big-emo{font-size:72px;animation:bounce 2s ease-in-out infinite;display:inline-block}
.rule h2{font-size:clamp(30px,6vw,46px);margin:6px 0}
.sub{font-size:18px;font-weight:700;color:#7A7194}
.flip{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0}
.w{padding:14px 22px;border-radius:22px;font-family:'Fredoka';font-size:clamp(22px,5vw,32px);font-weight:600}
.w small{display:block;font-family:'Nunito';font-size:11px;font-weight:800;letter-spacing:1px;opacity:.75}
.wa{background:#FFE0EC;color:#E0548C;box-shadow:0 5px 0 #F7C6DA}.wb{background:#DCEBFF;color:#3C67D8;box-shadow:0 5px 0 #BCD5FA}
.hint{margin-top:10px;background:#fff;border-radius:18px;padding:12px 18px;font-weight:800;display:inline-block;box-shadow:0 5px 0 #F3E3B5}

/* WORD SLIDE */
.top{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-weight:800;border-radius:99px;padding:6px 14px;font-size:13px;background:var(--c);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.tag.l{background:#fff;color:var(--c)}
.title{font-size:clamp(32px,7.5vw,54px);color:var(--c);text-shadow:0 3px 0 #fff}
.es-t{display:inline-block;margin-top:6px;font-size:clamp(16px,3.6vw,20px);font-weight:800;color:#7A7194;background:#fff;border-radius:99px;padding:4px 14px}

.art{position:relative;width:210px;height:210px;margin:18px auto 8px}
.blob{position:absolute;inset:0;border-radius:44% 56% 52% 48%/48% 42% 58% 52%;background:radial-gradient(circle at 30% 28%,#fff 0%,var(--l) 50%,var(--c) 150%);box-shadow:0 10px 0 rgba(0,0,0,.06);animation:morph 7s ease-in-out infinite}
@keyframes morph{50%{border-radius:56% 44% 42% 58%/55% 58% 42% 45%}}
.art .m{position:absolute;inset:0;display:grid;place-items:center;font-size:100px}
.slide.on .art .m{animation:pop .7s}
@keyframes pop{0%{transform:scale(.3) rotate(-20deg)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.art .s{position:absolute;font-size:34px;background:#fff;border-radius:50%;width:60px;height:60px;display:grid;place-items:center;box-shadow:0 5px 0 var(--l)}
.art .s1{top:-4px;right:-16px;animation:fl 4s ease-in-out infinite}
.art .s2{bottom:6px;left:-20px;animation:fl 4.5s ease-in-out infinite .8s}
.art .s3{bottom:-8px;right:4px;animation:fl 5s ease-in-out infinite .3s;width:50px;height:50px;font-size:26px}

.say{display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:#fff;border:3px solid var(--c);border-radius:99px;padding:8px 18px;font-weight:800;font-size:15px;color:#3B3355;box-shadow:0 4px 0 var(--l)}
.say:active{transform:translateY(3px);box-shadow:none}

.concept{margin-top:16px;background:#fff;border-radius:28px;padding:16px 20px;box-shadow:0 7px 0 var(--l);text-align:left;position:relative}
.concept:before{content:"✨";position:absolute;top:-14px;right:16px;font-size:26px}
.lbl{font-weight:800;font-size:12px;letter-spacing:1.5px;color:var(--c)}
.concept p{font-size:clamp(17px,3.6vw,21px);font-weight:700;margin-top:4px;line-height:1.4}
.concept p.sp{font-size:clamp(14px,3vw,16px);color:#7A7194;font-weight:600;font-style:italic;margin-top:6px}

details{margin-top:12px;border-radius:24px;text-align:left;overflow:hidden;background:#fff;box-shadow:0 5px 0 var(--dl)}
summary{list-style:none;cursor:pointer;padding:12px 14px;font-family:'Fredoka';font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px;background:var(--dl);color:#3B3355}
summary::-webkit-details-marker{display:none}
summary .ic{width:38px;height:38px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:21px;flex:0 0 auto}
summary small{font-family:'Nunito';font-size:12px;font-weight:700;color:#7A7194;display:block}
summary .ar{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--dc);color:#fff;display:grid;place-items:center;font-size:14px;transition:transform .3s;flex:0 0 auto}
details[open] summary .ar{transform:rotate(180deg)}
.dc{padding:14px}
details[open] .dc{animation:drop .35s ease}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
.d-how{--dl:#E5F0FF;--dc:#4A7CF0}
.d-key{--dl:#FFF1C9;--dc:#E0A800}
.d-ex{--dl:#DDF6E8;--dc:#25A563}
.d-fun{--dl:#FFE0EC;--dc:#E0548C}

.steps{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;justify-content:center}
.step{flex:1 1 90px;background:#F5F9FF;border-radius:18px;padding:10px 8px;text-align:center;font-weight:800;font-size:14px;position:relative}
.step b{display:block;font-size:30px;margin-bottom:4px}
.step small{display:block;font-weight:700;color:#7A7194;font-size:12px;margin-top:2px}
.arrowr{align-self:center;font-size:18px;color:#4A7CF0;font-weight:800}

.pts{display:grid;gap:8px}
.pt{display:flex;gap:10px;align-items:center;background:#FFFBEF;border-radius:16px;padding:10px 12px;font-weight:700;font-size:15.5px}
.pt b{font-size:24px;line-height:1;width:34px;text-align:center;flex:0 0 auto}
.exen{font-weight:800;font-size:17px;background:#F3FCF7;border-radius:16px;padding:12px}
.exen mark{background:var(--l);color:var(--c);padding:0 6px;border-radius:8px}
.exes{color:#7A7194;font-style:italic;font-size:15px;margin-top:6px;padding:0 4px}
.fun{display:flex;gap:12px;align-items:center;font-weight:700;font-size:16px}
.fun b{font-size:40px;flex:0 0 auto}
.fun i{display:block;color:#7A7194;font-weight:600;font-size:14px;margin-top:4px}

/* END */
.end h2{font-size:clamp(38px,8vw,60px);color:#E0548C}
.end p{font-size:18px;font-weight:800;color:#7A7194;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:16px 0}
.chips span{background:#fff;border-radius:99px;padding:6px 12px;font-weight:800;font-size:13px;box-shadow:0 3px 0 #EADCF7}

/* CONTROLS */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:14px 16px 16px;background:linear-gradient(180deg,rgba(255,249,242,0),rgba(255,249,242,.97) 40%)}
.prog{height:10px;background:#F1E6EF;border-radius:99px;overflow:hidden;max-width:700px;margin:0 auto 10px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF7BAC,#FFC93C,#3DBE7A,#4A7CF0,#8E5CF0);transition:width .4s;border-radius:99px}
.ctrl{display:flex;justify-content:center;align-items:center;gap:14px}
.nb{width:56px;height:56px;border-radius:50%;border:none;background:#FF7BAC;color:#fff;font-size:22px;font-weight:800;box-shadow:0 5px 0 #D9558A}
.nb:active{transform:translateY(4px);box-shadow:none}
.nb:disabled{opacity:.3}
.count{font-weight:800;min-width:72px;text-align:center;background:#fff;border-radius:99px;padding:6px 10px}
.cover-on .bar{display:none}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="bar">
  <div class="prog"><i id="prog"></i></div>
  <div class="ctrl">
    <button class="nb" id="prev" aria-label="Previous">◀</button>
    <span class="count" id="count"></span>
    <button class="nb" id="next" aria-label="Next">▶</button>
  </div>
</div>

/* BUILD */
const deck=document.getElementById('deck');
const sp=()=>`<span class="spark" style="top:4%;left:4%">✨</span><span class="spark" style="top:30%;right:2%;animation-delay:.8s">⭐</span><span class="spark" style="bottom:22%;left:1%;animation-delay:1.4s">💖</span>`;
let h=`<section class="slide cover" style="--l:transparent"><span class="fl" style="left:7%;top:12%">🥑</span><span class="fl" style="right:7%;top:14%;animation-delay:1s">🍓</span><span class="fl" style="left:9%;bottom:14%;animation-delay:2s">🥦</span><span class="fl" style="right:9%;bottom:16%;animation-delay:.5s">🥕</span><span class="fl" style="left:45%;top:5%;animation-delay:1.5s;font-size:30px">✨</span>
<div class="box"><div class="mascot">🍎</div><h1>Nutri<b>Words</b></h1>
<div class="student"><small>ENGLISH STUDENT</small><strong>Daniela Melissa Quiroz González</strong><span>🥗 Nutrition and Dietetics</span><div class="teacher"><small>TEACHER</small><strong>Brayan Elles</strong></div></div>
<div class="howto"><span>👆 Tap to open</span><span>👉 Swipe</span><span>🔊 Listen</span></div>
<button class="start" id="startBtn">Let's start! ▶</button></div></section>

<section class="slide rule" style="--bg:#FFF8E6;--l:#FFEFC2"><div class="box">${sp()}
<div class="big-emo">⭐</div><h2>Easy Rule</h2><p class="sub">In English, the main word goes at the END</p>
<div class="flip"><span class="w wa"><small>MAIN WORD</small>Gasto</span><span class="w wb"><small>DESCRIBES</small>energético</span></div>
<div style="font-size:34px">⬇️</div>
<div class="flip"><span class="w wb"><small>DESCRIBES</small>Energy</span><span class="w wa"><small>MAIN WORD</small>expenditure</span></div>
<div class="hint">💡 Read the English from right to left</div></div></section>`;

W.forEach((w,i)=>{const c=C[i%C.length];
h+=`<section class="slide" style="--c:${c[0]};--l:${c[1]};--bg:${c[2]}"><div class="box">${sp()}
 <div class="top"><span class="tag">${i+1} / ${W.length}</span><span class="tag l">${w.cat}</span></div>

 <details class="d-fun"><summary><span class="ic">💡</span><span>Fun fact<small>Did you know?</small></span><span class="ar">▾</span></summary><div class="dc"><div class="fun"><b>${w.fun[0]}</b><div>${w.fun[1]}<i>${w.fun[2]}</i></div></div></div></details>
</div></section>`});

h+=`<section class="slide end" style="--bg:#FFF5F9;--l:#FFDDEA"><div class="box">${sp()}<div class="big-emo">🎉</div><h2>Thank you!</h2>

/* NAV */
const S=[...document.querySelectorAll('.slide')];let cur=0;
function go(n){if(n<0||n>=S.length)return;S.forEach((s,i)=>{s.classList.toggle('on',i===n);s.classList.toggle('prev',i<n)});cur=n;S[n].scrollTop=0;
 document.body.classList.toggle('cover-on',n===0);
 document.getElementById('count').textContent=n+' / '+(S.length-1);
 document.getElementById('prog').style.width=(n/(S.length-1)*100)+'%';
 document.getElementById('prev').disabled=n===0;document.getElementById('next').disabled=n===S.length-1;}
document.getElementById('startBtn').onclick=()=>go(1);
document.getElementById('againBtn').onclick=()=>go(0);
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
let x0=null,y0=null;document.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(cur+(dx<0?1:-1));x0=null});
deck.addEventListener('click',e=>{const b=e.target.closest('.say');if(!b)return;try{const u=new SpeechSynthesisUtterance(b.dataset.t);u.lang='en-US';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(err){}});
go(0);
</script>
